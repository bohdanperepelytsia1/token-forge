# Кузня токенів — nginx (Docker-образ або власний сервер).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1k;   # сайт статичний і нічого не приймає

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location ~ /(\.|_headers$) { return 404; }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /models/ {
        limit_except GET HEAD { deny all; }
        default_type application/octet-stream;
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /models/resources.json {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
}
